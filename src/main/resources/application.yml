spring:
  application:
    name: finassist-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/finassist
    username: finassist
    password: finassist

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        options:
          model: qwen2.5:3b

      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true

    chat:
      observations:
        log-prompt: true
        log-completion: true

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.ai.chat.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics